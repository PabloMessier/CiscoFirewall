---
# ──────────────────────────────────────────────────────────────────
# configure_asav.yml — Ansible playbook to configure the Cisco ASAv
#
# Configures:
#   - Interfaces (inside / outside)
#   - NAT (PAT for outbound)
#   - ACLs permitting HTTP, HTTPS, ICMP inspection
#   - Static routes
#   - Logging
#
# Prerequisites:
#   - pip install ansible cisco.asa
#   - ansible-galaxy collection install cisco.asa
#   - ASAv is booted and reachable via SSH on the Elastic IP
#
# Usage:
#   ansible-playbook -i ansible/inventory.ini ansible/configure_asav.yml
# ──────────────────────────────────────────────────────────────────
- name: Configure Cisco ASAv Firewall
  hosts: asav
  gather_facts: false

  vars:
    inside_gateway: "10.0.2.1"        # VPC gateway for inside ENI subnet (10.0.2.0/28)
    workload_subnet_a: "10.0.5.0"    # Workload subnet A
    workload_mask_a: "255.255.255.192"
    workload_subnet_b: "10.0.6.0"    # Workload subnet B
    workload_mask_b: "255.255.255.192"
    alb_subnet_a: "10.0.3.0"         # ALB subnet A
    alb_subnet_b: "10.0.4.0"         # ALB subnet B
    alb_mask: "255.255.255.224"       # /27
    alb_server_ip: "10.0.3.17"       # ALB private IP
    firewall_vip: "10.0.1.10"        # Secondary IP on outside ENI (NAT VIP)
    vpc_cidr: "10.0.0.0"
    vpc_mask: "255.255.240.0"         # /20

  tasks:
    # ── Interface Configuration ─────────────────────────────────
    - name: Configure outside interface (Management0/0)
      cisco.asa.asa_config:
        lines:
          - nameif outside
          - security-level 0
          - ip address dhcp setroute
          - no shutdown
        parents: interface Management0/0

    - name: Configure inside interface (TenGigabitEthernet0/0)
      cisco.asa.asa_config:
        lines:
          - nameif inside
          - security-level 100
          - ip address dhcp
          - no shutdown
        parents: interface TenGigabitEthernet0/0

    # ── Access Lists ────────────────────────────────────────────
    - name: Create outside-to-inside ACL (allow inspection traffic)
      cisco.asa.asa_config:
        lines:
          - access-list OUTSIDE_IN extended permit tcp any any eq 80
          - access-list OUTSIDE_IN extended permit tcp any any eq 443
          - access-list OUTSIDE_IN extended permit icmp any any

    - name: Create inside-to-outside ACL (allow outbound)
      cisco.asa.asa_config:
        lines:
          - access-list INSIDE_OUT extended permit ip {{ workload_subnet_a }} {{ workload_mask_a }} any
          - access-list INSIDE_OUT extended permit ip {{ workload_subnet_b }} {{ workload_mask_b }} any

    - name: Apply ACLs to interfaces
      cisco.asa.asa_config:
        lines:
          - access-group OUTSIDE_IN in interface outside
          - access-group INSIDE_OUT in interface inside

    # ── NAT — Twice NAT for outbound workload traffic ────────────
    - name: Remove legacy simple PAT rule (replaced by twice NAT)
      cisco.asa.asa_config:
        lines:
          - no nat (inside,outside) source dynamic any interface
      ignore_errors: true

    - name: Create ANY_NET object for twice NAT
      cisco.asa.asa_config:
        parents: object network ANY_NET
        lines:
          - subnet 0.0.0.0 0.0.0.0

    - name: Configure twice NAT (outbound)
      cisco.asa.asa_config:
        lines:
          - nat (inside,outside) source dynamic any interface destination static ANY_NET ANY_NET

    # ── Static Routes ───────────────────────────────────────────
    # Inside ENI is in 10.0.2.0/28 (connected). All other internal subnets
    # need routes via the VPC gateway at 10.0.2.1.
    - name: Configure static routes
      cisco.asa.asa_config:
        lines:
          - route inside {{ workload_subnet_a }} {{ workload_mask_a }} {{ inside_gateway }}
          - route inside {{ workload_subnet_b }} {{ workload_mask_b }} {{ inside_gateway }}
          - route inside {{ alb_subnet_a }} {{ alb_mask }} {{ inside_gateway }}
          - route inside {{ alb_subnet_b }} {{ alb_mask }} {{ inside_gateway }}

    # ── ICMP Inspection ─────────────────────────────────────────
    - name: Enable ICMP inspection
      cisco.asa.asa_config:
        parents:
          - policy-map global_policy
          - class inspection_default
        lines:
          - inspect icmp

    # ── ICMP Permit (allow ping to firewall interfaces) ──────────
    - name: Permit ICMP on outside and inside interfaces
      cisco.asa.asa_config:
        lines:
          - icmp permit any outside
          - icmp permit any inside

    # ── Inbound NAT — route internet HTTP through firewall to ALB ─
    # Uses a secondary IP (VIP) on the outside ENI so traffic is not
    # treated as "self-addressed".  Twice NAT translates both source
    # (PAT to inside IP) and destination (VIP → ALB) for symmetric
    # return traffic.
    - name: Create ALB_SERVER object
      cisco.asa.asa_config:
        parents: object network ALB_SERVER
        lines:
          - host {{ alb_server_ip }}

    - name: Create FIREWALL_VIP object
      cisco.asa.asa_config:
        parents: object network FIREWALL_VIP
        lines:
          - host {{ firewall_vip }}

    - name: Create HTTP_PORT service object
      cisco.asa.asa_config:
        parents: object service HTTP_PORT
        lines:
          - service tcp destination eq 80

    - name: Configure twice NAT for inbound HTTP
      cisco.asa.asa_config:
        lines:
          - nat (outside,inside) source dynamic any interface destination static FIREWALL_VIP ALB_SERVER service HTTP_PORT HTTP_PORT

    # ── Logging
    - name: Enable logging
      cisco.asa.asa_config:
        lines:
          - logging enable
          - logging buffered informational
          - logging trap informational

    # ── Save configuration ──────────────────────────────────────
    - name: Write running config to startup
      cisco.asa.asa_config:
        save: true

    # ── Verify ──────────────────────────────────────────────────
    - name: Show interface status
      cisco.asa.asa_command:
        commands:
          - show interface ip brief
      register: intf_output

    - name: Display interface status
      debug:
        var: intf_output.stdout_lines

    - name: Show access-lists
      cisco.asa.asa_command:
        commands:
          - show access-list
      register: acl_output

    - name: Display ACLs
      debug:
        var: acl_output.stdout_lines
